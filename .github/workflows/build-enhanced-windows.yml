name: Build Upscayl Enhanced Windows (review build)
on:
  push:
    branches: [feature/enhanced-pause-resume]
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'common/**'
      - 'renderer/**'
      - 'vendor/upscayl-ncnn/**'
      - 'tools/build-enhanced-engine.py'
      - 'tools/enhanced-builder.cjs'
      - 'tools/verify-enhanced-windows.py'
      - 'tests/jobs/**'
      - 'package*.json'
      - '.github/workflows/build-enhanced-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.5'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install verified build packages
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6
          choco install vulkan-sdk --version=1.3.280.0 --yes --no-progress
          $sdk = Get-Item C:\VulkanSDK\1.3.280.0
          if (!$sdk) { throw 'Pinned Vulkan SDK not found' }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH
      - run: npm ci
      - name: Compile modified engine
        run: python tools/build-enhanced-engine.py
      - name: Compile and test sessions
        run: |
          npm run tsc
          node --test tests/jobs/session.test.cjs
      - name: Test native admission and drain protocol
        shell: cmd
        run: cl /std:c++17 /utf-8 /EHsc tests\jobs\protocol.cpp /Fe:protocol-test.exe && protocol-test.exe
      - name: Build renderer and Windows packages
        run: |
          npm run build
          node tests/jobs/ui.smoke.cjs
          npx electron-builder --win --x64 --config tools/enhanced-builder.cjs --publish never
      - name: Verify installer and ZIP payloads and compute delivery checksums
        run: python tools/verify-enhanced-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Upscayl-Enhanced-2.15.0-jm.1-Windows-x64
          path: |
            dist-enhanced/*.exe
            dist-enhanced/*.zip
            dist-enhanced/SHA256.txt
            dist-enhanced/delivery-manifest.json
          if-no-files-found: error
