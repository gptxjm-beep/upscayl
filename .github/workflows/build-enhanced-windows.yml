name: Build Upscayl Enhanced Windows (review build)
on:
  push:
    branches: [feature/jm5-long-png-two-stage]
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'common/**'
      - 'renderer/**'
      - 'vendor/upscayl-ncnn/**'
      - 'tools/build-enhanced-engine.py'
      - 'tools/enhanced-builder.cjs'
      - 'tools/verify-enhanced-windows.py'
      - 'tools/install-vulkan-sdk.ps1'
      - 'tools/ci-command.py'
      - 'tests/jobs/**'
      - 'package*.json'
      - '.github/workflows/build-enhanced-windows.yml'
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.5'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned CMake
        run: python tools/ci-command.py --label CMake -- python -m pip install cmake==3.31.6
      - name: Install signature-verified pinned Vulkan SDK
        run: python tools/ci-command.py --label Vulkan-SDK -- pwsh -NoProfile -File tools/install-vulkan-sdk.ps1
      - run: python tools/ci-command.py --label npm-ci -- npm ci
      - name: Restore engine matching exact source and SDK
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            resources/win/bin/upscayl-jm.exe
            vendor/upscayl-ncnn/build/Release/jm-png-test.exe
          key: windows-x64-jm-${{ hashFiles('vendor/upscayl-ncnn/**', 'tools/build-enhanced-engine.py', 'tools/install-vulkan-sdk.ps1', 'tests/jobs/png-stream.cpp') }}
      - name: Compile modified engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: python tools/ci-command.py --label native-engine -- python tools/build-enhanced-engine.py
      - name: Retain verified-source engine for packaging retries
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            resources/win/bin/upscayl-jm.exe
            vendor/upscayl-ncnn/build/Release/jm-png-test.exe
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Compile TypeScript
        run: python tools/ci-command.py --label TypeScript -- npm run tsc
      - name: Test persistent sessions
        run: python tools/ci-command.py --label sessions --timeout-seconds 240 -- node --test tests/jobs/session.test.cjs tests/jobs/asar-path.test.cjs tests/jobs/recovery-ux.test.cjs tests/jobs/output.test.cjs tests/jobs/single-output.test.cjs tests/jobs/open-image.test.cjs tests/jobs/model-metadata.test.cjs tests/jobs/image-errors.test.cjs
      - name: Test native admission and drain protocol
        shell: cmd
        run: cl /std:c++17 /utf-8 /EHsc tests\jobs\protocol.cpp /Fe:protocol-test.exe && protocol-test.exe
      - name: Test WIC codec on fresh Windows threads (no GPU)
        shell: cmd
        run: cl /std:c++17 /utf-8 /EHsc tests\jobs\wic.cpp /Fe:wic-test.exe /link windowscodecs.lib ole32.lib oleaut32.lib && wic-test.exe "%RUNNER_TEMP%\jm2-codec"
      - name: Test streaming long PNG and full decode (no GPU)
        run: python tools/ci-command.py --label streaming-PNG -- vendor/upscayl-ncnn/build/Release/jm-png-test.exe .test-artifacts/long-png
      - name: Decode long PNG with independent libvips
        run: python tools/ci-command.py --label long-PNG-independent -- node tests/jobs/long-png.cjs .test-artifacts/long-png/1440x70200.png
      - name: Fetch jm.2 reference artifact for regression comparison
        uses: actions/download-artifact@v4
        with:
          name: Upscayl-Enhanced-2.15.0-jm.2-Portable-x64
          run-id: 42720664346
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jm2-reference
      - name: Extract reference engine only
        shell: pwsh
        run: python tools/extract-jm2-reference.py "$env:RUNNER_TEMP/jm2-reference"
      - name: Test real batch inference and recovery with software Vulkan
        run: python tools/ci-command.py --label software-Vulkan-functional -- node --test tests/jobs/native-functional.cjs
      - name: Test two-stage 1000-image admission, checkpoints and crash recovery
        run: python tools/ci-command.py --label two-stage-native --timeout-seconds 900 -- node --test tests/jobs/two-stage-native.cjs
      - name: Check Windows resource observation helper (no GPU benchmark)
        run: python tools/ci-command.py --label resource-observation -- pwsh -NoProfile -File tools/monitor-enhanced-resources.ps1 -DurationSeconds 1 -IntervalSeconds 1 -OutputCsv .test-artifacts/resources-probe.csv
      - name: Build renderer
        run: python tools/ci-command.py --label renderer -- npm run build
      - name: Smoke test Electron UI
        run: python tools/ci-command.py --label Electron-smoke -- node tests/jobs/ui.smoke.cjs
      - name: Test custom recovery dialogs and pending actions
        run: python tools/ci-command.py --label recovery-dialogs -- node tests/jobs/recovery-dialogs.cjs
      - name: Test two-stage controls and legacy payload isolation
        run: python tools/ci-command.py --label two-stage-UI --timeout-seconds 180 -- node tests/jobs/two-stage-ui.cjs
      - name: Test nonblocking image error counter and completion report actions
        run: python tools/ci-command.py --label completion-UI --timeout-seconds 180 -- node tests/jobs/completion-ui.cjs
      - name: Test Electron close and source-folder recovery
        run: python tools/ci-command.py --label Electron-recovery -- node tests/jobs/recovery-ui.cjs
      - name: Package Windows installer and portable ZIP
        run: python tools/ci-command.py --label packaging -- npx electron-builder --win --x64 --config tools/enhanced-builder.cjs --publish never
      - name: Test packaged Windows drag-and-drop and long-PNG preview
        shell: pwsh
        run: |
          $env:UPSCAYL_TEST_APP_EXE = (Resolve-Path 'dist-enhanced/win-unpacked/Upscayl Enhanced.exe').Path
          $env:UPSCAYL_TEST_LONG_PNG = (Resolve-Path '.test-artifacts/long-png/1440x70200.png').Path
          python tools/ci-command.py --label packaged-drop --timeout-seconds 180 -- node tests/jobs/drop-ui.cjs
      - name: Verify installer and ZIP payloads and compute delivery checksums
        run: python tools/ci-command.py --label verification -- python tools/verify-enhanced-windows.py
      - name: Install pinned CPU model-conversion and reference tools
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/models/requirements.txt
      - name: Verify all three original trained models and both ordered model pairs on Windows
        run: python tools/ci-command.py --label Windows-model-reference --timeout-seconds 3600 -- python tools/models/windows-ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: jm5-Optional-Model-Compatibility
          path: |
            .test-artifacts/optional-models
            .test-artifacts/trained-two-stage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Upscayl-Enhanced-2.15.0-jm.5-Installer-x64
          path: |
            dist-enhanced/*.exe
            dist-enhanced/SHA256.txt
            dist-enhanced/delivery-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Upscayl-Enhanced-2.15.0-jm.5-Portable-x64
          path: |
            dist-enhanced/*.zip
            dist-enhanced/SHA256.txt
            dist-enhanced/delivery-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-diagnostics
          path: |
            .test-artifacts/
            !.test-artifacts/**/*.bin
            !.test-artifacts/**/*.pth
          include-hidden-files: true
          if-no-files-found: ignore
