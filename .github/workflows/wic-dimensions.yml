name: Investigate Windows WIC dimension constraints
on:
  push:
    branches: [fix/jm4-recovery-ux]
    paths: ['tests/jobs/wic-dimensions.cpp', '.github/workflows/wic-dimensions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Probe native Windows codecs, no GPU or performance benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .test-artifacts | Out-Null
          Get-ComputerInfo OsName,OsVersion,OsBuildNumber | Out-String | Tee-Object .test-artifacts/system.txt
          (Get-Item "$env:WINDIR\System32\WindowsCodecs.dll").VersionInfo | Select-Object FileVersion,ProductVersion | Out-String | Tee-Object -Append .test-artifacts/system.txt
          cl /std:c++17 /utf-8 /EHsc tests\jobs\wic-dimensions.cpp /Fe:wic-dimensions.exe /link windowscodecs.lib ole32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\wic-dimensions.exe | Tee-Object .test-artifacts/wic-dimensions.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item wic-dimensions.exe .test-artifacts/
          Get-Content .test-artifacts/wic-dimensions.txt | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WIC-dimension-diagnostics
          path: .test-artifacts/
          include-hidden-files: true
